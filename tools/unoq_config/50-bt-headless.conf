# ~/.config/wireplumber/wireplumber.conf.d/50-bt-headless.conf  (Uno Q, user arduino)
#
# The board runs headless (adb / lingering systemd user session, no logind seat).
# WirePlumber's default `main` profile gates the BlueZ monitor on an active seat,
# so Bluetooth audio devices never appear. Disable that gating.
wireplumber.profiles = {
  main = {
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}
